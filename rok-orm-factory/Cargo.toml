[package]
name = "rok-orm-factory"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Model factories for testing rok-orm models"
keywords = ["orm", "factory", "testing", "faker", "rok"]
categories = ["database", "development-tools::testing"]

[dependencies]
rok-orm-core = { path = "../rok-orm-core", version = "0.3.0" }
rok-orm      = { path = "../rok-orm", version = "0.3.0", optional = true }
sqlx  = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
uuid  = { workspace = true }
rand  = { workspace = true }
serde      = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
## Enable async `create()` against PostgreSQL.
postgres = ["dep:sqlx", "dep:tokio", "dep:rok-orm", "rok-orm/postgres", "sqlx/postgres", "dep:serde", "dep:serde_json"]
