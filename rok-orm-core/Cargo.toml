[package]
name = "rok-orm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core traits and query builder for rok-orm"
keywords = ["orm", "query-builder", "database", "rok"]
categories = ["database"]

[features]
sqlx-postgres = ["sqlx/postgres", "sqlx/runtime-tokio-native-tls"]
sqlx-sqlite   = ["sqlx/sqlite",   "sqlx/runtime-tokio-native-tls"]
sqlx-mysql    = ["sqlx/mysql",    "sqlx/runtime-tokio-native-tls"]
tenant        = ["dep:tokio", "dep:tower", "dep:http"]

[dependencies]
thiserror = { workspace = true }
serde     = { workspace = true }
sqlx  = { version = "0.8", optional = true, default-features = false, features = ["macros"] }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
http  = { workspace = true, optional = true }
once_cell = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
