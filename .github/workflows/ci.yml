name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Check (no default features)
        run: cargo check --no-default-features

      - name: Check (postgres only)
        run: cargo check --features postgres

      - name: Check (sqlite only)
        run: cargo check --features sqlite

      - name: Check (query feature)
        run: cargo check --features query

      - name: Check (active + postgres)
        run: cargo check --features "active,postgres"

      - name: Check (full bundle)
        run: cargo check --features full
