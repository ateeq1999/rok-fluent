name: Publish

# Triggers on any push to main that bumps Cargo.toml version,
# OR when a v* tag is pushed manually.
on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ── Guard: only publish when the version in Cargo.toml is new ───────────────
  check-version:
    name: Check if version is new
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from Cargo.toml
        id: check
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Check whether this exact version is already on crates.io
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://crates.io/api/v1/crates/rok-fluent/$VERSION")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version $VERSION already published — skipping."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is new — will publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  # ── CI gate: must pass before publish ────────────────────────────────────────
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    needs: check-version
    if: needs.check-version.outputs.should_publish == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Feature matrix
        run: |
          cargo check --no-default-features
          cargo check --features postgres
          cargo check --features sqlite
          cargo check --features query
          cargo check --features "active,postgres"
          cargo check --features full

  # ── Publish macros crate, then main crate ────────────────────────────────────
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [check-version, test]
    if: needs.check-version.outputs.should_publish == 'true'
    environment: crates-io   # optional: require manual approval in GitHub UI

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-cargo-

      - name: Publish rok-fluent-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rok-fluent-macros --no-verify

      - name: Wait for crates.io to index rok-fluent-macros
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          echo "Waiting for rok-fluent-macros $VERSION to appear on crates.io…"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/rok-fluent-macros/$VERSION")
            if [ "$STATUS" = "200" ]; then
              echo "rok-fluent-macros $VERSION is indexed."
              break
            fi
            echo "  Not yet (attempt $i/12) — sleeping 15s…"
            sleep 15
          done

      - name: Publish rok-fluent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p rok-fluent --no-verify

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "v${{ needs.check-version.outputs.version }}"
          body: |
            ## rok-fluent v${{ needs.check-version.outputs.version }}

            Published to [crates.io](https://crates.io/crates/rok-fluent/${{ needs.check-version.outputs.version }}).

            See [CHANGELOG](https://github.com/ateeq1999/rok-fluent/blob/main/docs/changelog.md) for details.
          generate_release_notes: true
