[workspace]
members = [".", "rok-fluent-macros"]
resolver = "2"

[workspace.package]
version     = "0.4.1"
edition     = "2021"
license     = "MIT"
authors     = ["ateeq1999"]
repository  = "https://github.com/ateeq1999/rok-fluent"
homepage    = "https://github.com/ateeq1999/rok-fluent"

[workspace.dependencies]
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
base64      = "0.22"
chrono      = { version = "0.4", features = ["serde"] }
uuid        = { version = "1", features = ["v4", "serde"] }
once_cell   = { version = "1" }
rand        = "0.8"
sqlx        = { version = "0.8", default-features = false, features = ["macros", "chrono", "uuid", "json"] }
tokio       = { version = "1",   default-features = false }
axum        = { version = "0.8" }
tower       = { version = "0.5" }
http        = { version = "1"   }
dashmap     = { version = "6"   }
syn         = { version = "2",   features = ["full"] }
quote       = "1"
proc-macro2 = "1"
heck        = "0.5"
clap        = { version = "4",   features = ["derive"] }

# ── Package ──────────────────────────────────────────────────────────────────

[package]
name        = "rok-fluent"
version.workspace   = true
edition.workspace   = true
license.workspace   = true
authors.workspace   = true
repository.workspace = true
homepage.workspace  = true
description = "Eloquent-inspired async ORM for Rust (PostgreSQL, MySQL, SQLite)"
keywords    = ["orm", "database", "async", "postgres", "sqlx"]
categories  = ["database"]
readme      = "README.md"
rust-version = "1.85"
exclude     = ["docs/", "plan.md", "todo.md", ".github/", "target/"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lib]
name = "rok_fluent"
path = "src/lib.rs"
bench = false

[[bin]]
name = "rok"
path = "src/bin/rok.rs"
required-features = ["cli"]

# ── Examples ─────────────────────────────────────────────────────────────────
# Runnable via `cargo run --example <name> --features <required-features>`.
# See examples/*.rs module docs for the exact command and DATABASE_URL notes.

[[example]]
name = "01_quickstart"
path = "examples/01_quickstart.rs"
required-features = ["sqlite", "active"]

[[example]]
name = "02_crud"
path = "examples/02_crud.rs"
required-features = ["postgres", "query"]

[[example]]
name = "03_relations_eager_loading"
path = "examples/03_relations_eager_loading.rs"
required-features = ["postgres", "active"]

[[example]]
name = "04_transactions_locking"
path = "examples/04_transactions_locking.rs"
required-features = ["postgres", "active"]

[[example]]
name = "05_migrations"
path = "examples/05_migrations.rs"
required-features = ["migrate-postgres"]

[[example]]
name = "06_factories_faker"
path = "examples/06_factories_faker.rs"
required-features = ["factory", "sqlite", "active"]

[[example]]
name = "07_axum_integration"
path = "examples/07_axum_integration.rs"
required-features = ["postgres", "axum", "active"]

[[example]]
name = "08_search_filter_sort"
path = "examples/08_search_filter_sort.rs"
required-features = ["postgres", "active"]

[[example]]
name = "09_window_functions_cte"
path = "examples/09_window_functions_cte.rs"
required-features = ["postgres", "query"]

[[example]]
name = "10_multi_tenancy"
path = "examples/10_multi_tenancy.rs"
required-features = ["tenant"]

[[example]]
name = "11_hooks"
path = "examples/11_hooks.rs"
required-features = ["postgres", "active"]

[[example]]
name = "12_validation"
path = "examples/12_validation.rs"
required-features = ["postgres", "active", "validate"]

[[example]]
name = "13_repository_di"
path = "examples/13_repository_di.rs"
required-features = ["postgres", "active"]

[[example]]
name = "14_query_cache"
path = "examples/14_query_cache.rs"
required-features = ["postgres", "query", "cache"]

# ── Features ─────────────────────────────────────────────────────────────────

[features]
# Always-on: derive macros (Model, Resource, Seed, query!)
default = ["macros"]

# Proc-macro derive support
macros = ["dep:rok-fluent-macros"]

# ── Query styles ──────────────────────────────────────────────────────────────

# Active Record / Eloquent style — PgModel, MysqlModel, SqliteModel, ModelQuery,
# PivotQuery, MorphTo*, ThroughQuery.  Requires at least one database backend.
# Pulls in `dep:async-trait` for the PostgreSQL Repository<M> / DI override trait.
active = ["dep:async-trait"]

# Drizzle-style typed query DSL — db::select().from(users::table).where_(...).
# Requires at least one database backend.
query = []

# ── Database backends ─────────────────────────────────────────────────────────
postgres = [
    "dep:sqlx", "sqlx/postgres", "sqlx/runtime-tokio-native-tls",
    "dep:tokio", "tokio/rt",
    "dep:futures-core", "dep:futures", "dep:dashmap",
]
sqlite = [
    "dep:sqlx", "sqlx/sqlite", "sqlx/runtime-tokio-native-tls",
    "dep:tokio", "tokio/rt",
]
mysql = [
    "dep:sqlx", "sqlx/mysql", "sqlx/runtime-tokio-native-tls",
    "dep:tokio", "tokio/rt",
]

# Web / tower integration (implies postgres)
axum = ["dep:axum", "dep:tower", "postgres"]

# Observability
tracing = ["dep:tracing"]
metrics = ["dep:metrics"]

# Multi-tenancy (task-local tenant ID + Tower layer)
tenant = ["dep:tower", "dep:http", "dep:tokio", "tokio/rt"]

# Read-replica routing strategies
replica = []

# Test / seeding factories. `.make()`/`.make_many()` only need `factory`
# (in-memory). `.create()`/`.create_many()` additionally need `active` plus a
# database backend — `factory-postgres` for PostgreSQL, or `factory` + `sqlite`
# + `active` for SQLite (no separate `factory-sqlite` feature).
factory          = []
factory-postgres = ["factory", "postgres"]

# Validation — integrates the `validator` crate's `#[derive(Validate)]` field
# attributes with `Hooks::before_save`/`before_create` via `From<validator::ValidationErrors> for OrmError`.
validate = ["dep:validator"]

# Opt-in per-query result cache (rok_fluent::orm::cache) — TTL-based, table-keyed,
# invalidated automatically on writes through the DSL builders / Active Record executor.
# Declared independently of `postgres` (which also pulls in `dashmap` for its own
# named-pool registry) so `cache` doesn't force-enable a database backend just for the
# dependency; the cache *terminals* on `SelectBuilder` are still postgres-only this phase.
cache = ["dep:dashmap"]

# Migrations
migrate          = ["dep:async-trait", "dep:anyhow"]
migrate-postgres = ["migrate", "postgres"]
migrate-sqlite   = ["migrate", "sqlite"]
migrate-mysql    = ["migrate", "mysql"]

# rok db CLI — rok db migrate|rollback|status|make|seed|schema
cli = ["dep:clap", "migrate-postgres"]

# Convenience bundle
full = [
    "macros", "active", "query",
    "postgres", "axum", "tracing", "metrics",
    "tenant", "replica", "factory-postgres", "migrate-postgres", "cli",
]

# ── Dependencies ─────────────────────────────────────────────────────────────

[dependencies]
# always-on
thiserror  = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
base64     = { workspace = true }
chrono     = { workspace = true }
uuid       = { workspace = true }
once_cell  = { workspace = true }
rand       = { workspace = true }

# feature-gated
rok-fluent-macros = { version = "0.4", path = "rok-fluent-macros", optional = true }
sqlx        = { workspace = true, optional = true }
tokio       = { workspace = true, optional = true }
futures-core = { version = "0.3", optional = true }
futures      = { version = "0.3", optional = true }
dashmap      = { workspace = true, optional = true }
axum         = { workspace = true, optional = true }
tower        = { workspace = true, optional = true }
http         = { workspace = true, optional = true }
tracing      = { version = "0.1", optional = true }
metrics      = { version = "0.24", optional = true }
async-trait  = { version = "0.1", optional = true }
anyhow       = { version = "1",   optional = true }
clap         = { workspace = true, optional = true }
validator    = { version = "0.21", optional = true, features = ["derive"] }

[[bench]]
name = "query_build"
harness = false

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
criterion = { version = "0.5", features = ["html_reports"] }
