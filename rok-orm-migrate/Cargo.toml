[package]
name = "rok-orm-migrate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Database migration DSL for the rok ORM ecosystem"
keywords = ["orm", "migration", "database", "rok"]
categories = ["database"]

[dependencies]
sqlx        = { workspace = true, optional = true }
tokio       = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
anyhow      = { workspace = true, optional = true }

[features]
## Enable async migration runner against a PostgreSQL database.
postgres = ["dep:sqlx", "dep:tokio", "dep:async-trait", "dep:anyhow", "sqlx/postgres"]
